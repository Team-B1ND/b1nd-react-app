name: 🐛 버그 보고
description: 버그나 문제 보고
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        버그 보고해주셔서 감사합니다! 아래 양식을 작성해주세요.
        - 먼저 [기존 이슈](https://github.com/Team-B1ND/b1nd-react-app/issues)를 확인해주세요
        - 기능 요청은 [토론](https://github.com/Team-B1ND/b1nd-react-app/discussions)을 사용해주세요

  - type: textarea
    attributes:
      label: 문제 설명
      description: 어떤 버그인가요? 명확하고 간결하게 설명해주세요.
      placeholder: |
        X를 하면 Z가 되어야 하는데 Y가 됩니다
    validations:
      required: true

  - type: textarea
    attributes:
      label: 재현 방법
      description: 어떻게 하면 같은 문제를 재현할 수 있나요?
      placeholder: |
        1. `npm create b1nd-react-app@latest`로 새 프로젝트 생성
        2. Rsbuild + TypeScript 선택
        3. `npm run dev` 실행
        4. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: 예상 동작 vs 실제 동작
      description: 어떻게 되어야 하는지 vs 실제로는 어떻게 되는지
      placeholder: |
        예상: 개발 서버가 30초 안에 시작됨
        실제: 개발 서버가 2분이 걸림
    validations:
      required: true

  - type: input
    attributes:
      label: 환경 정보
      description: Node 버전, OS, 패키지 매니저 등
      placeholder: "Node v20.10, Windows 11, npm 10.2.0"
    validations:
      required: false

  - type: textarea
    attributes:
      label: 추가 정보
      description: 스크린샷, 로그, 에러 메시지 등
    validations:
      required: false
