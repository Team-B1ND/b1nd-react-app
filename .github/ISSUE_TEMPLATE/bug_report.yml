name: 🐛 Bug Report
description: Report a bug or issue
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below.
        - Check [existing issues](https://github.com/Team-B1ND/b1nd-react-app/issues) first
        - For feature requests, use [Discussions](https://github.com/Team-B1ND/b1nd-react-app/discussions)

  - type: textarea
    attributes:
      label: Description
      description: What's the bug? Clear and concise description.
      placeholder: |
        When I do X, Y happens instead of Z
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Create a new project with `npm create b1nd-react-app@latest`
        2. Select Rsbuild + TypeScript
        3. Run `npm run dev`
        4. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected vs Actual
      description: What should happen vs what actually happens
      placeholder: |
        Expected: Dev server starts in 30 seconds
        Actual: Dev server takes 2 minutes
    validations:
      required: true

  - type: input
    attributes:
      label: Environment
      description: Node version, OS, package manager, etc.
      placeholder: "Node v20.10, Windows 11, npm 10.2.0"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Info
      description: Screenshots, logs, error messages, or anything else
    validations:
      required: false
