name: PR Control and Labeling

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr-label:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Add label based on PR title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request.number;
            const pr_title = context.payload.pull_request.title;
            const pr_body = context.payload.pull_request.body || '';

            let labels = [];

            // PR 제목에 따른 라벨 추가
            if (pr_title.includes('🔒') || pr_title.includes('Security') || pr_title.includes('security')) {
              labels.push('security');
            }
            if (pr_title.includes('🐛') || pr_title.includes('Fix') || pr_title.includes('fix')) {
              labels.push('bug');
            }
            if (pr_title.includes('♻️') || pr_title.includes('Refactor') || pr_title.includes('refactor')) {
              labels.push('refactor');
            }
            if (pr_title.includes('✨') || pr_title.includes('Feature') || pr_title.includes('feature')) {
              labels.push('enhancement');
            }
            if (pr_title.includes('📚') || pr_title.includes('Docs') || pr_title.includes('docs')) {
              labels.push('documentation');
            }
            if (pr_title.includes('🧪') || pr_title.includes('Test') || pr_title.includes('test')) {
              labels.push('test');
            }

            // PR 본문에서 관련 이슈 찾기
            if (pr_body.includes('Closes #') || pr_body.includes('Fixes #')) {
              labels.push('ready-for-review');
            }

            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr_number,
                  labels: labels
                });
                console.log(`Added labels to PR #${pr_number}: ${labels.join(', ')}`);
              } catch (error) {
                console.log('Error adding labels:', error);
              }
            }

  pr-control:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment'
    steps:
      - name: Handle PR commands
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (!context.payload.issue.pull_request) {
              return;
            }

            const pr_number = context.payload.issue.number;
            const comment_body = context.payload.comment.body.toLowerCase();

            // /close 커맨드
            if (comment_body.includes('/close')) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: 'This PR was closed using the `/close` command.',
              });
              console.log(`PR #${pr_number} has been closed`);
            }

            // /ready 커맨드 - ready-for-review 라벨 추가
            if (comment_body.includes('/ready')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                labels: ['ready-for-review']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: 'This PR is now marked as ready for review using the `/ready` command.',
              });
              console.log(`PR #${pr_number} marked as ready for review`);
            }

            // /wip 커맨드 - work-in-progress 라벨 추가
            if (comment_body.includes('/wip')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                labels: ['work-in-progress']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: 'This PR is marked as work-in-progress using the `/wip` command.',
              });
              console.log(`PR #${pr_number} marked as work-in-progress`);
            }

            // /remove-label 커맨드
            if (comment_body.includes('/remove-label')) {
              const label_match = comment_body.match(/\/remove-label\s+(.+)/);
              if (label_match) {
                const label_name = label_match[1].trim();
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr_number,
                    name: label_name
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr_number,
                    body: `Removed label: \`${label_name}\``,
                  });
                  console.log(`Removed label '${label_name}' from PR #${pr_number}`);
                } catch (error) {
                  console.log(`Error removing label: ${error.message}`);
                }
              }
            }
